services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JEKYLL_ENV: production
    user: "${PREVIEW_UID}:${PREVIEW_GID}"
    command:
      - bundle
      - exec
      - jekyll
      - serve
      - --lsi
      - --watch
      - --livereload
      - --force_polling
      - --host=0.0.0.0
      - --port=8080
      - --livereload-port=35729
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-8080}:8080"
      - "127.0.0.1:35729:35729"
    volumes:
      - .:/srv/jekyll
