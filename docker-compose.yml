# builds the image from the local Dockerfile (pinned Ubuntu/Ruby) instead of
# pulling a prebuilt image whose Ruby version can change underneath us
services:
  jekyll:
    build: .
    # rebuild on every `up`; cached unless Gemfile/Dockerfile changed
    pull_policy: build
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
